services:
  practice_image:
    container_name: practice_container
    image: postgres:17.2
    restart: always
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=shatyk
      - POSTGRES_PASSWORD=qwerty123
      - POSTGRES_DB=practice_db
    volumes:
      - ./data/postgres:/var/lib/postgresql/data